name: Verify desktop pets

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = git -c core.quotePath=false ls-files -- '*.js' '*.cjs' '*.mjs'
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Output "Syntax OK ($($files.Count) files)"
      - name: Verify manifest, hashes, and root regression tests
        shell: pwsh
        run: |
          $prevRef = (Get-Content deployment.json -Raw | ConvertFrom-Json).previousRef
          if ($prevRef) {
            node scripts/verify.cjs --previous-ref $prevRef
          } else {
            node scripts/verify.cjs
          }
      - name: Run GPT product tests and package doctor fixture
        run: npm --prefix integrations/gpt-niang/product-electron test
      - name: Run GPT maintenance and playback-lab tests
        shell: pwsh
        run: |
          $maint = Get-ChildItem integrations/gpt-niang/maintenance/tests/*.test.* | ForEach-Object { $_.FullName }
          node --test $maint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lab = Get-ChildItem integrations/gpt-niang/playback-lab/*.test.cjs | ForEach-Object { $_.FullName }
          node --test $lab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Python test dependencies
        run: python -m pip install -r tests/requirements-ci.txt
      - name: Run Python test suites
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Check animated .gitignore does not hide new source files
        shell: pwsh
        run: |
          $ignored = git -c core.quotePath=false ls-files --others --ignored --exclude-standard integrations/gpt-niang/animated | Where-Object { $_ -match '\.(cjs|mjs|js|ts|cs|ps1|py|cmd|bat|json|md)$' -or $_ -match '/$' }
          if ($ignored) {
            Write-Error ("Ignored source/doc files or directories found under animated/:`n" + ($ignored -join "`n"))
            exit 1
          }
